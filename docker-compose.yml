# 三个容器：db（Postgres+pgvector）/ app（FastAPI）/ web（Caddy 托管前端并反代 API）
# 首次启动前：cp .env.example .env 并填好 DB_PASSWORD 与 APP_DB_PASSWORD

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: keeper
      POSTGRES_USER: keeper
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      # 初始化脚本用这个变量建 keeper_app 角色（应用连接用的非 owner 角色）
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init-keeper-app.sh:/docker-entrypoint-initdb.d/init-keeper-app.sh:ro
    ports:
      # 只绑定本机，供本地开发直连；生产环境删掉这一段
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keeper -d keeper"]
      interval: 10s
      retries: 5

  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./backend/prompts:/app/prompts:ro
    env_file: .env
    environment:
      # 容器内连库用 db 这个主机名；应用必须用 keeper_app，不能用 owner
      DATABASE_URL: postgresql+psycopg://keeper_app:${APP_DB_PASSWORD}@db:5432/keeper
      # 迁移走 owner；host 必须是 db，不能沿用 .env 里的 localhost
      DATABASE_URL_MIGRATE: postgresql+psycopg://keeper:${DB_PASSWORD}@db:5432/keeper
      DATA_DIR: /app/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "uv run python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # 每日任务（扫事件 → 生成提醒 → 推送 → 权重衰减）。第一价值，必须随部署启动。
  # 单独容器而不是塞进 app：scheduler 崩了不影响 API，app 发布也不打断定时器。
  scheduler:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./backend/prompts:/app/prompts:ro
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://keeper_app:${APP_DB_PASSWORD}@db:5432/keeper
      DATA_DIR: /app/data
    command: ["uv", "run", "python", "-m", "app.jobs.daily", "--serve"]
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - app
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  # 助理侧车（可选）：`docker compose --profile assistant up -d harness`
  #
  # 默认不启动 —— 它不是主流程的一部分，删了也不影响投喂/提醒/待办（ARCHITECTURE 19.7.4）。
  # 只读：容器里没有任何数据库凭据，只能通过下面的 KEEPER_API 走 /api/assistant/*。
  harness:
    image: node:22-alpine
    profiles: ["assistant"]
    working_dir: /app
    depends_on:
      - app
    volumes:
      - ./harness:/app
      - harness_node:/app/node_modules
    environment:
      # 容器内用服务名，不是 127.0.0.1
      KEEPER_API: http://app:8000
      # 与主服务 .env 里的 ASSISTANT_TOKEN 同一个值（compose 自动读根目录 .env）
      KEEPER_ASSISTANT_TOKEN: ${ASSISTANT_TOKEN:?助理侧车需要 ASSISTANT_TOKEN}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?助理侧车需要 DEEPSEEK_API_KEY}
    ports:
      # 只绑本机：助理界面不该直接暴露到公网
      - "127.0.0.1:3080:3080"
    # 如果容器里起不来（绑定地址/端口参数变了），先看 `npx dsh web --help`
    command: sh -c "npm install --no-audit --no-fund && npx dsh web --patch ./cordis.patch.yml"
    restart: unless-stopped

volumes:
  pg_data:      # 数据库卷，绝对不能丢
  caddy_data:   # 证书卷
  caddy_config: # Caddy 配置卷
  harness_node: # 助理侧车的 node_modules（重建容器不用重装 600 个包）
