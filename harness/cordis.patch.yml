# Keeper 的 Harness 覆盖层：把只读工具插件挂进 web profile。
#
# 用法（不装任何东西，随时可拆）：
#   ./run.sh                       # 内部就是 npx dsh web --patch ./cordis.patch.yml
#
# 格式依据 `~/.dsh/profiles/web/cordis.patch.yml` 的原话：
#   "a top-level YAML array of loader patch entries
#    (id-targeted config overrides, disables, and insert lists)"
# 所以「新增一个插件」走 insert 列表；只有改已有条目才需要顶层 id。
#
# 自查：npx dsh --profile web --patch ./cordis.patch.yml --dump-config | grep keeper
- insert:
    - id: keeper-tools
      name: ./keeper-tools/index.js
