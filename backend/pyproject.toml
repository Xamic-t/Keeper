[project]
name = "keeper-backend"
version = "0.1.0"
description = "Keeper — 私域关系维护 Agent 后端"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "python-multipart>=0.0.17",
    "httpx>=0.28",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "apscheduler>=3.10",
    "pillow>=11.0",
    "lunar-python>=1.4",
    "chinesecalendar>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# 自动生成的迁移文件不参与 lint（不能手工维护）
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ANN", # flake8-annotations — 强制类型注解
]
ignore = [
    "ANN401", # 允许 Any（少数地方确实需要）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # 测试函数不强制注解

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
